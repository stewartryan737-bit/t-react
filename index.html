<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Treact</title>
    <link rel="stylesheet" href="style.css" />
    <script
      src="https://kit.fontawesome.com/258831ddfd.js"
      crossorigin="anonymous"
    ></script>
    <script src="index.js"></script>
  </head>
  <body>
    <section id="landing">
      <nav>
        <div class="row nav__row">
          <div class="nav__logo">
            <img
              class="nav__logo--img"
              src="./assets-treact/logo.2c489fc453a1783cbadacf914efa3df6.svg"
              alt=""
            />
          <div class="nav__logo--title"><span class="blue">Treact</span></div>
          </div>
          <ul class="nav__links">
            <li class="nav__link">
              <a href="#" class="nav__link--anchor link__hover-effect link__hover-effect--black">About</a>
            </li>
            <li class="nav__link">
              <a href="#" class="nav__link--anchor link__hover-effect link__hover-effect--black">Blog</a>
            </li>
            <li class="nav__link">
              <a href="#" class="nav__link--anchor link__hover-effect link__hover-effect--black">Pricing</a>
            </li>
            <li class="nav__link">
              <a href="#" class="nav__link--anchor link__hover-effect link__hover-effect--black">Contact Us</a>
            </li>
            <li class="nav__link">
              <a href="#" class="nav__link--anchor link__hover-effect link__hover-effect--black">Login</a>
            </li>
            <li class="nav__link">
              <a href="#" class="nav__link--anchor nav__link--anchor--primary">Sign Up</a>
            </li>
          </ul>
        </div>
      </nav>
      <header>
        <div class="header__container">
          <div class="row">
            <div class="header__description">
              <h1>
                Beautiful React Templates <span class="text-purple"> for you</span>
              </h1>
              <p class="header__description--para">Our templates are easy to setup, understand and customize. Fully modular components with a variety of pages and components.</p>
              <div class="header__email">
                <input type="text" class="header__email--input" placeholder="Your E-mail Address" />
                <button class="header__email--btn">Get Started</button>
                <p class="header__customers--tite">
                  Our Trusted Customers
                </p>
                <img class="header__customers" src="./assets-treact/customers-logo-strip.680ac7c2e8ae28161d2c.png" alt="">
              </div>
            </div>
            <figure class="header__img--wrapper">
              <img class="header__img" src="./assets-treact/design-illustration-2.6da6a00b20c07c4a9b65d1870679e1b8.svg" alt="">
            </figure>
          </div>
        </div>
      </header>
    </section>
  </body>
</html>
